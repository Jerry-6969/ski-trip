name: Fetch piste data (OpenStreetMap)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/fetch_pistes.py', '.github/workflows/pistes.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch from Overpass
        run: python3 tools/fetch_pistes.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update piste data from OpenStreetMap"
          git pull --rebase
          git push
